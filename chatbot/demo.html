<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSO Room Helper · Chatbot demo</title>
  <!-- Stand-in page for testing the chatbot alone. The real page is the skeleton's index.html. -->
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f5f3; color: #1d1d1f; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #990000; color: #fff; }
    header b { font-size: 18px; } header span { font-size: 12px; background: rgba(255,255,255,.18); padding: 3px 10px; border-radius: 999px; }
    main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(340px, 1.3fr); gap: 16px; padding: 16px; height: calc(100vh - 52px); box-sizing: border-box; }
    .map { background: #fff; border: 1px solid #e3e3e6; border-radius: 12px; padding: 12px 16px; overflow: auto; }
    .map h2 { margin: 0 0 4px; font-size: 16px; } .map p { margin: 0 0 8px; color: #5f6368; font-size: 13px; }
    .map h3 { font-size: 13px; color: #5f6368; margin: 12px 0 6px; text-transform: uppercase; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 2px solid transparent; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12px; cursor: pointer; text-align: left; color: #111; }
    .chip small { display: block; opacity: .75; }
    .chip.rec { border-color: #ffcc00; box-shadow: 0 0 0 2px #990000; }
    .chip.sel { outline: 3px solid #990000; }
    #rso-chat { min-height: 0; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #rso-chat { height: 80vh; order: -1; } }
  </style>
</head>
<body>
  <header><b>RSO Room Helper</b><span>Sample data · chatbot demo</span></header>
  <main>
    <section class="map" aria-label="Room popularity (placeholder)">
      <h2>Room popularity</h2>
      <p>Placeholder for the heatmap. Grey = few requests, red = many (70+ in 30 days). Recommended rooms get a gold outline.</p>
      <p id="source"></p>
      <div id="rooms"></div>
    </section>

    <!-- This is all the skeleton page needs: -->
    <div id="rso-chat"></div>
  </main>
  <script src="widget/rso-chat.js"></script>

  <script>
    // Placeholder heatmap showing how the real map can listen to the chatbot.
    const heat = (p) => {
      const s = [[235, 235, 235], [255, 196, 0], [214, 40, 40]];
      const [a, b, t] = p < 0.5 ? [s[0], s[1], p / 0.5] : [s[1], s[2], (p - 0.5) / 0.5];
      return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
    };
    let recommended = [];
    async function loadRooms() {
      const { rooms, live, updated_at } = await (await fetch('/api/rooms')).json();
      document.getElementById('source').textContent = live ? `Live from GitHub · ${rooms.length} rooms · synced ${new Date(updated_at).toLocaleTimeString()}` : `${rooms.length} rooms from a local file`;
      const byB = {};
      rooms.forEach((r) => (byB[r.building_id] ||= []).push(r));
      document.getElementById('rooms').innerHTML = Object.entries(byB).map(([b, list]) =>
        `<h3>${b}</h3><div class="chips">${list.map((r) =>
          `<button class="chip${recommended.includes(r.id) ? ' rec' : ''}" data-id="${r.id}" style="background:${heat(r.popularity)}" title="${r.name}: ${r.requests_last_30_days} requests in 30 days">${r.name.replace(/^Demo \w+ Room /, '')}<small>${r.capacity} seats · ${r.requests_last_30_days} req</small></button>`).join('')}</div>`).join('');
      document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => RSOChat.ask(`Tell me about room ${c.dataset.id}. Would it work for my event?`)));
    }
    loadRooms();
    setInterval(loadRooms, 30000); // picks up new rooms from GitHub
    window.addEventListener('rso:rooms-recommended', (e) => {
      recommended = e.detail.room_ids;
      document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('rec', e.detail.room_ids.includes(c.dataset.id)));
    });
    window.addEventListener('rso:room-selected', (e) => {
      document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('sel', c.dataset.id === e.detail.room_id));
      document.querySelector(`.chip[data-id="${CSS.escape(e.detail.room_id)}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
  </script>
</body>
</html>
